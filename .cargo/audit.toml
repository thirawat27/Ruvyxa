# cargo-audit configuration for the RustSec production dependency audit.
#
# The CI job in `.github/workflows/security.yml` runs
# `cargo audit --file Cargo.lock --deny warnings`, so any advisory — including
# the informational classes (unmaintained, unsound, yanked) — fails the build
# unless it is listed here with the reason it does not apply.

[advisories]
ignore = [
  # RUSTSEC-2024-0436 — `paste` is unmaintained (not a vulnerability).
  #
  # `paste` is never compiled into any Ruvyxa binary. It is a phantom entry in
  # Cargo.lock: the `image` crate declares `avif` and `exr` as OPTIONAL features
  # (avif -> ravif -> rav1e -> paste, exr -> pulp -> paste), and Cargo records a
  # dependency's optional deps in the lockfile whether or not the feature is on.
  # `Cargo.toml` pins `image` with `default-features = false` and only
  # `jpeg`/`png`/`webp`, so neither feature is active:
  #
  #   cargo tree --target all --all-features -i paste  ->  "nothing to print"
  #
  # Removing this entry would mean dropping the maintained, widely-used `image`
  # crate and re-implementing its `DynamicImage` decode/resize/encode surface
  # from raw decoders — a correctness-sensitive refactor for zero security gain.
  # Kept ignored, not evicted, so `--deny warnings` still fails on any NEW
  # unmaintained/unsound/yanked crate that actually enters the build graph.
  "RUSTSEC-2024-0436",
]
