name: Security audit

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/package.json'
      - pnpm-lock.yaml
      - .github/workflows/security.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/package.json'
      - pnpm-lock.yaml
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rustsec:
    name: RustSec production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo lockfile
        run: cargo audit --file Cargo.lock

  javascript:
    name: JavaScript production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level low
      # `--prod` excludes devDependencies, and the root manifest declares *only*
      # devDependencies — knip, oxlint, prettier, typescript, react, @types/node,
      # postcss. So the lane above audits none of the JavaScript tooling that
      # runs inside CI, including inside the release job that holds NPM_TOKEN.
      # A second pass covers them, at `high` rather than `low` because a
      # development-only advisory at every severity is noise that would train
      # people to ignore this job.
      - name: Audit development dependencies
        run: pnpm audit --audit-level high
