name: Ruvyxa Framework CI

on:
  # `push` used to carry no filter, so a branch with an open pull request ran
  # the whole five-platform matrix twice for one change — once for the push and
  # once for the pull request. Branch pushes are covered by `pull_request`; what
  # stays here is what nothing else verifies.
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A branch may cancel its own earlier run. `main` and a release tag may not:
  # cancelling there leaves a commit with no verdict at all, and this is not
  # hypothetical — the run on 307aece was cancelled by the next push, that
  # commit never went green, and it was inside the tag that shipped. Whatever
  # is released has to have been verified on every platform it claims.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_HTTP_TIMEOUT: '120'
  CARGO_NET_RETRY: '10'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # A panic with no backtrace costs a whole round trip to reproduce, and a CI
  # round trip here is a five-platform matrix.
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  msrv:
    # Must match `rust-version` in the workspace Cargo.toml. When that floor
    # moves, this pin is the only other place that has to move with it: the job
    # name and the cache key deliberately carry no version, and rust-cache
    # already keys its cache on the resolved rustc.
    name: MSRV compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ruvyxa-msrv
      - run: cargo check --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.19.0'
          - os: ubuntu-24.04-arm
            node: '24.19.0'
          - os: macos-latest
            node: '24.19.0'
          - os: windows-latest
            node: '24.19.0'
          - os: windows-11-arm
            node: '24.19.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: 'ruvyxa-${{ matrix.os }}'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prefetch Rust dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "cargo fetch failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          cargo fetch --locked
      - name: Install JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "pnpm install failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          pnpm install --frozen-lockfile --prefer-offline
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check workspace formatting
        run: pnpm format:check
      - name: Check Cargo lockfile
        run: pnpm check:cargo-lock
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Build packages
        run: pnpm -r build
      - name: Check packages
        run: pnpm -r check
      - name: Test packages
        run: pnpm -r test
      - name: Validate release metadata
        run: pnpm release:validate
      - name: Smoke test package tarballs
        run: pnpm pack:smoke
      # The deployment smoke builds examples/deploy-smoke, not examples/demo.
      # The demo is deployable now that a dynamic server-components route no
      # longer refuses (RUV2213 is gone), but it is the broad feature fixture:
      # these steps are about the emitted server, so they build the smallest app
      # that exercises every part of it and check the answers over HTTP.
      - name: Build and launch Node deployment artifact
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter node
          node scripts/smoke-runtime-adapter.mjs node examples/deploy-smoke/.ruvyxa/deploy/node 4390
      - name: Set up Bun runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Verify Bun JavaScript runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: cargo run -p ruvyxa_cli -- check --root examples/demo --runtime bun
      - name: Build and launch Bun deployment artifact
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --runtime bun --adapter bun
          node scripts/smoke-runtime-adapter.mjs bun examples/deploy-smoke/.ruvyxa/deploy/bun 4391
      - name: Set up Deno runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '2.9.5'
      - name: Verify Deno JavaScript runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: cargo run -p ruvyxa_cli -- check --root examples/demo --runtime deno
      - name: Build and launch Deno deployment artifact
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --runtime deno --adapter deno
          node scripts/smoke-runtime-adapter.mjs deno examples/deploy-smoke/.ruvyxa/deploy/deno 4392
      # The edge lane, which had no deployment coverage at all until it was the
      # only place a NODE_ENV left at "development" could survive: an edge
      # bundle has no `process`, so the literal compiled into it is the only
      # value React ever reads, and nothing here had ever run one.
      #
      # It builds a pruned copy rather than examples/deploy-smoke itself,
      # because that app has an ISR route and `adapter.supports` says cloudflare
      # has no ISR — the build refuses it with RUV2202, correctly. Add another
      # ISR route and this step fails by name rather than skipping quietly.
      - name: Build and exercise the Cloudflare worker
        timeout-minutes: 15
        shell: bash
        run: |
          FIXTURE=$(node scripts/edge-fixture.mjs examples/deploy-smoke --drop cached)
          cargo run -p ruvyxa_cli -- build --root "$FIXTURE" --adapter cloudflare
          node scripts/smoke-runtime-adapter.mjs edge "$FIXTURE/.ruvyxa/deploy/cloudflare/worker" 4393
      # railway and render emit the same standalone server and the same layout
      # as the node adapter. That is a claim about three adapters that can drift
      # apart quietly, so each is launched under its own name: when it breaks,
      # the failure says which one.
      - name: Build and launch the Railway artifact
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter railway
          node scripts/smoke-runtime-adapter.mjs railway examples/deploy-smoke/.ruvyxa/deploy/railway 4398
      - name: Build and launch the Render artifact
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter render
          node scripts/smoke-runtime-adapter.mjs render examples/deploy-smoke/.ruvyxa/deploy/render 4399
      # The four serverless adapters, each launched the way its platform
      # invokes it.
      #
      # They share `createHandler`, which the node lane already proves. What
      # they do not share is the glue on either side of it — the request
      # translation each adapter hand-writes, and the static half its platform
      # answers without ever calling the function. That second half is where a
      # deployed pre-rendered page turned out to carry none of the security
      # headers the same page carries under `ruvyxa start`, on all four at once.
      #
      # Each build is followed immediately by its smoke: a build rewrites
      # .ruvyxa/deploy, so netlify's publish directory does not survive the
      # next adapter's build.
      - name: Build and launch the Vercel function
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter vercel
          node scripts/smoke-runtime-adapter.mjs vercel examples/deploy-smoke/.vercel/output/functions/__ruvyxa_handler.func 4394 examples/deploy-smoke/.vercel/output/static examples/deploy-smoke/.vercel/output/config.json
      - name: Build and launch the Netlify function
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter netlify
          node scripts/smoke-runtime-adapter.mjs netlify examples/deploy-smoke/.netlify/v1/functions/ruvyxa-handler 4395 examples/deploy-smoke/.ruvyxa/deploy/netlify/publish examples/deploy-smoke/.netlify/v1/config.json
      - name: Build and launch the AWS Amplify compute bundle
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter aws
          node scripts/smoke-runtime-adapter.mjs aws examples/deploy-smoke/.amplify-hosting/compute/default 4396 examples/deploy-smoke/.amplify-hosting/static examples/deploy-smoke/.amplify-hosting/deploy-manifest.json
      - name: Build and launch the Firebase function
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter firebase
          node scripts/smoke-runtime-adapter.mjs firebase examples/deploy-smoke/.ruvyxa/deploy/firebase/functions 4397 examples/deploy-smoke/.ruvyxa/deploy/firebase/public examples/deploy-smoke/.ruvyxa/deploy/firebase/firebase.json
      # The static target emits no server at all, so the deployment is the
      # publish directory and every claim it makes is a file in it. Two of those
      # have no other lane that can check them: `_headers`, its only mechanism
      # for a cache or security policy, and `404.html`, the only way the
      # project's own not-found page is reachable with nothing running to read a
      # manifest. Its fixture drops everything a publish directory cannot answer
      # — add an API, ISR, or SSR route to deploy-smoke and this build fails with
      # RUV2202 naming it rather than skipping quietly.
      - name: Build and serve the static publish directory
        timeout-minutes: 15
        shell: bash
        run: |
          FIXTURE=$(node scripts/edge-fixture.mjs examples/deploy-smoke --out .static --drop api/health --drop cached --drop rsc)
          cargo run -p ruvyxa_cli -- build --root "$FIXTURE" --adapter static
          node scripts/smoke-runtime-adapter.mjs static "$FIXTURE/.ruvyxa/static" 4400 "$FIXTURE/.ruvyxa/static"
