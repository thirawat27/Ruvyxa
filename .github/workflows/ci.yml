name: Ruvyxa Framework CI

on:
  # `push` used to carry no filter, so a branch with an open pull request ran
  # the whole five-platform matrix twice for one change — once for the push and
  # once for the pull request. Branch pushes are covered by `pull_request`; what
  # stays here is what nothing else verifies.
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A branch may cancel its own earlier run. `main` and a release tag may not:
  # cancelling there leaves a commit with no verdict at all, and this is not
  # hypothetical — the run on 307aece was cancelled by the next push, that
  # commit never went green, and it was inside the tag that shipped. Whatever
  # is released has to have been verified on every platform it claims.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_HTTP_TIMEOUT: '120'
  CARGO_NET_RETRY: '10'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # A panic with no backtrace costs a whole round trip to reproduce, and a CI
  # round trip here is a five-platform matrix.
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  msrv:
    # Must match `rust-version` in the workspace Cargo.toml. When that floor
    # moves, this pin is the only other place that has to move with it: the job
    # name and the cache key deliberately carry no version, and rust-cache
    # already keys its cache on the resolved rustc.
    name: MSRV compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ruvyxa-msrv
      - run: cargo check --workspace --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.19.0'
          - os: ubuntu-24.04-arm
            node: '24.19.0'
          - os: macos-latest
            node: '24.19.0'
          - os: windows-latest
            node: '24.19.0'
          - os: windows-11-arm
            node: '24.19.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: 'ruvyxa-${{ matrix.os }}'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prefetch Rust dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "cargo fetch failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          cargo fetch --locked
      - name: Install JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "pnpm install failed on attempt ${attempt}; retrying in ${delay}s"
            sleep "$delay"
          done
          pnpm install --frozen-lockfile --prefer-offline
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check workspace formatting
        run: pnpm format:check
      - name: Check Cargo lockfile
        run: pnpm check:cargo-lock
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Build packages
        run: pnpm -r build
      - name: Check packages
        run: pnpm -r check
      # Bounded, because the failure this step actually had was not a failing
      # assertion. A test awaited a promise nothing could settle, so the runner
      # never printed a summary and never exited: five platforms sat at the
      # job's 60-minute ceiling and reported "cancelled", which reads as a
      # runner problem rather than as the deterministic bug it was. A hang here
      # now costs 20 minutes and names the step.
      - name: Test packages
        timeout-minutes: 20
        run: pnpm -r test
      - name: Validate release metadata
        run: pnpm release:validate
      - name: Smoke test package tarballs
        run: pnpm pack:smoke
      # Every lane below this one exercises a *build*. This one exercises the
      # command developers actually run: it starts `ruvyxa dev`, edits the
      # project under it, and checks what the browser would have been told —
      # the watcher, the HMR tracker, the socket, and the client bundler are all
      # covered a unit at a time and the seam between them by nobody.
      # Built once and named, rather than left to `cargo run`. With the wrapper
      # in the way the smoke's child is `cargo` and `ruvyxa dev` is *its* child,
      # so the teardown signalled the wrapper and left a `ruvyxa.exe` bound to
      # 4402 holding `target\debug\ruvyxa.exe` open and a watcher on
      # examples/deploy-smoke — which the very next steps of this job then link
      # against and rebuild. That reads as a flaky runner.
      - name: Build the CLI the dev server smoke runs
        run: cargo build -p ruvyxa_cli
      - name: Exercise the dev server
        timeout-minutes: 20
        shell: bash
        env:
          RUVYXA_CLI: ${{ github.workspace }}/target/debug/ruvyxa${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node scripts/smoke-dev-server.mjs examples/deploy-smoke 4402
      # Fails by name here instead of as an "Access is denied" link error three
      # steps later.
      - name: Confirm the dev server released its port
        shell: bash
        run: |
          node -e "
            const server = require('node:net').createServer()
            server.on('error', (error) => {
              console.error('port 4402 is still held after the dev server smoke: ' + error.code)
              process.exit(1)
            })
            server.listen(4402, '127.0.0.1', () => server.close())
          "
      # The scaffold-to-clean walk: `create-ruvyxa`, every CLI command, the
      # build targets, dev/prod parity, the production server, `preview`, the
      # build-time error scenarios, and a rebuild after `clean`. It is the most
      # complete flow in the repository and it ran nowhere, so a regression in
      # any of it was found by whoever next ran it by hand. PowerShell-only and
      # bound to `target\debug\ruvyxa.exe`, which is why it is one leg.
      - name: Walk the full project flow
        if: matrix.os == 'windows-latest'
        timeout-minutes: 45
        shell: pwsh
        run: |
          cargo build -p ruvyxa_cli
          pnpm test:full-flow
      # The deployment smoke builds examples/deploy-smoke, not examples/demo.
      # The demo is deployable now that a dynamic server-components route no
      # longer refuses (RUV2213 is gone), but it is the broad feature fixture:
      # these steps are about the emitted server, so they build the smallest app
      # that exercises every part of it and check the answers over HTTP.
      - name: Build and launch Node deployment artifact
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter node
          node scripts/smoke-runtime-adapter.mjs node examples/deploy-smoke/.ruvyxa/deploy/node 4390
      - name: Set up Bun runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Verify Bun JavaScript runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: cargo run -p ruvyxa_cli -- check --root examples/demo --runtime bun
      - name: Build and launch Bun deployment artifact
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --runtime bun --adapter bun
          node scripts/smoke-runtime-adapter.mjs bun examples/deploy-smoke/.ruvyxa/deploy/bun 4391
      - name: Set up Deno runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '2.9.5'
      - name: Verify Deno JavaScript runtime parity
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: cargo run -p ruvyxa_cli -- check --root examples/demo --runtime deno
      - name: Build and launch Deno deployment artifact
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --runtime deno --adapter deno
          node scripts/smoke-runtime-adapter.mjs deno examples/deploy-smoke/.ruvyxa/deploy/deno 4392
      # The edge lane, which had no deployment coverage at all until it was the
      # only place a NODE_ENV left at "development" could survive: an edge
      # bundle has no `process`, so the literal compiled into it is the only
      # value React ever reads, and nothing here had ever run one.
      #
      # It builds a pruned copy rather than examples/deploy-smoke itself,
      # because that app has an ISR route and a PPR route, and `adapter.supports`
      # says cloudflare has neither without KV — the build refuses them with
      # RUV2202, correctly. Add another ISR or PPR route and this step fails by
      # name rather than skipping quietly.
      - name: Build and exercise the Cloudflare worker
        timeout-minutes: 15
        shell: bash
        run: |
          FIXTURE=$(node scripts/edge-fixture.mjs examples/deploy-smoke --drop cached --drop ppr)
          cargo run -p ruvyxa_cli -- build --root "$FIXTURE" --adapter cloudflare
          node scripts/smoke-runtime-adapter.mjs edge "$FIXTURE/.ruvyxa/deploy/cloudflare/worker" 4393
      # The same emitted server, asked what the *application* carries.
      #
      # Every lane above deploys `examples/deploy-smoke` — five routes, no
      # plugins — so the whole plugin lane, three of the five render strategies,
      # and a streamed document were deployed by nobody and asked by nothing. A
      # response hook that turned every 204 into a 500 lived in that gap, and so
      # did a deployed build that buffered every render instead of streaming it.
      - name: Deploy and probe the feature fixture
        timeout-minutes: 20
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/demo --adapter node
          node scripts/smoke-runtime-adapter.mjs node examples/demo/.ruvyxa/deploy/node 4401 --app demo
      # railway and render emit the same standalone server and the same layout
      # as the node adapter. That is a claim about three adapters that can drift
      # apart quietly, so each is launched under its own name: when it breaks,
      # the failure says which one.
      - name: Build and launch the Railway artifact
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter railway
          node scripts/smoke-runtime-adapter.mjs railway examples/deploy-smoke/.ruvyxa/deploy/railway 4398
      - name: Build and launch the Render artifact
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter render
          node scripts/smoke-runtime-adapter.mjs render examples/deploy-smoke/.ruvyxa/deploy/render 4399
      # The four serverless adapters, each launched the way its platform
      # invokes it.
      #
      # They share `createHandler`, which the node lane already proves. What
      # they do not share is the glue on either side of it — the request
      # translation each adapter hand-writes, and the static half its platform
      # answers without ever calling the function. That second half is where a
      # deployed pre-rendered page turned out to carry none of the security
      # headers the same page carries under `ruvyxa start`, on all four at once.
      #
      # Each build is followed immediately by its smoke: a build rewrites
      # .ruvyxa/deploy, so netlify's publish directory does not survive the
      # next adapter's build.
      - name: Build and launch the Vercel function
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter vercel
          node scripts/smoke-runtime-adapter.mjs vercel examples/deploy-smoke/.vercel/output/functions/__ruvyxa_handler.func 4394 examples/deploy-smoke/.vercel/output/static examples/deploy-smoke/.vercel/output/config.json
      - name: Build and launch the Netlify function
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter netlify
          node scripts/smoke-runtime-adapter.mjs netlify examples/deploy-smoke/.ruvyxa/deploy/netlify/functions/ruvyxa-handler 4395 examples/deploy-smoke/.ruvyxa/deploy/netlify/publish examples/deploy-smoke/netlify.toml
      - name: Build and launch the AWS Amplify compute bundle
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter aws
          node scripts/smoke-runtime-adapter.mjs aws examples/deploy-smoke/.amplify-hosting/compute/default 4396 examples/deploy-smoke/.amplify-hosting/static examples/deploy-smoke/.amplify-hosting/deploy-manifest.json
      - name: Build and launch the Firebase function
        timeout-minutes: 15
        shell: bash
        run: |
          cargo run -p ruvyxa_cli -- build --root examples/deploy-smoke --adapter firebase
          node scripts/smoke-runtime-adapter.mjs firebase examples/deploy-smoke/.ruvyxa/deploy/firebase/functions 4397 examples/deploy-smoke/.ruvyxa/deploy/firebase/public examples/deploy-smoke/.ruvyxa/deploy/firebase/firebase.json
      # The static target emits no server at all, so the deployment is the
      # publish directory and every claim it makes is a file in it. Two of those
      # have no other lane that can check them: `_headers`, its only mechanism
      # for a cache or security policy, and `404.html`, the only way the
      # project's own not-found page is reachable with nothing running to read a
      # manifest. Its fixture drops everything a publish directory cannot answer
      # — add an API, ISR, PPR, or SSR route to deploy-smoke and this build fails with
      # RUV2202 naming it rather than skipping quietly.
      - name: Build and serve the static publish directory
        timeout-minutes: 15
        shell: bash
        run: |
          FIXTURE=$(node scripts/edge-fixture.mjs examples/deploy-smoke --out .static --drop api/health --drop cached --drop rsc --drop ppr)
          cargo run -p ruvyxa_cli -- build --root "$FIXTURE" --adapter static
          node scripts/smoke-runtime-adapter.mjs static "$FIXTURE/.ruvyxa/static" 4400 "$FIXTURE/.ruvyxa/static"
      # Reproducibility: build, wipe, build again, compare every emitted byte.
      #
      # Everything else in this repository gates the *ingredients* — the
      # `localeCompare` ban, the host-locale case-folding ban, explicit
      # comparators, the shared ordering fixtures. This is the only lane that
      # checks the property they exist to produce, and it ran in no workflow at
      # all: `verify:reproducible` was a package script nobody had a reason to
      # type. A gate that is never executed is indistinguishable from one that
      # does not exist.
      #
      # One leg, and `examples/deploy-smoke` rather than `examples/demo`: it is
      # two more full builds, and the question — does anything in the build
      # depend on wall-clock time, iteration order, a random value, an absolute
      # path, or the host locale — is not platform-specific. It runs last
      # because it wipes and rewrites `.ruvyxa` for the project it is given.
      #
      # Invoked as the script rather than through `pnpm verify:reproducible`,
      # which is the same command with no arguments: `--root` after a pnpm
      # shorthand is pnpm's to parse, not the script's.
      - name: Verify the build is reproducible
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        shell: bash
        run: node scripts/verify-reproducible.mjs --root examples/deploy-smoke
