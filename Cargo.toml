[workspace]
members = [
  "crates/ruvyxa_cli",
  "crates/ruvyxa_dev_server",
  "crates/ruvyxa_graph",
  "crates/ruvyxa_diagnostics",
  "crates/ruvyxa_middleware",
  "crates/ruvyxa_bundler",
  "crates/ruvyxa_tui",
]
resolver = "3"

# Shipped as the npm-distributed native CLI binary: favor runtime speed and
# download size over release compile time. panic stays "unwind" because the
# dev server must survive per-request panics.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thirawat27/ruvyxa"
rust-version = "1.96"

[workspace.lints.clippy]
# Nursery lint, off by default. Turned on because the JavaScript side now has
# an equivalent gate (`.oxlintrc.json`), and the crates that grew the largest
# functions - the resolver, the linker, the dev server - are the same ones
# that have taken repeat regressions.
cognitive_complexity = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
blake3 = "1.8.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
futures-core = "0.3.34"
# Already compiled as part of axum's dependency tree; declaring it directly adds
# no crate to the build and lets a bidirectional WebSocket be split into an
# independent sender and receiver, which `tokio::select!` cannot do with a
# single mutably borrowed socket.
#
# `default-features = false` is load-bearing: the defaults pull in the
# `async-await` macros and their proc-macro chain, which are not in the tree.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
grass = "0.13.4"
# Decoders called directly instead of through the `image` facade. `image`
# declares `avif`/`exr` as optional features, and Cargo records a dependency's
# optional deps in the lockfile whether or not the feature is on — so `ravif`,
# `rav1e`, `pulp` and their unmaintained `paste` macro sat in `Cargo.lock`
# permanently even though none of them ever compiled. These three are the
# decoders `image` itself wraps for the formats Ruvyxa accepts.
png = "0.18.1"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
image-webp = "0.2.4"
# Test fixtures only: the decoders above are decode-only, and several tests need
# to produce a real JPEG on disk to exercise the build-time optimizer.
jpeg-encoder = "0.7.1"
# SIMD (AVX2/SSE4.1/NEON) convolution resize.
#
# `fast_image_resize` filled this role and was measurably the fastest, but it
# declares `image` as an OPTIONAL dependency, and Cargo records a dependency's
# optional deps in `Cargo.lock` whether or not the feature is on. That kept
# `image` -> `ravif`/`exr` -> `rav1e`/`pulp` -> the unmaintained `paste` macro
# (RUSTSEC-2024-0436) permanently in the lockfile even after this repository
# stopped depending on `image` directly. `pic-scale` reaches the same SIMD
# convolution through a dependency tree that contains none of them.
#
# Measured on a 6000x4000 RGB source producing all eight responsive widths:
# 3628 ms with `image::imageops` (scalar), 72 ms with `fast_image_resize`,
# 89 ms here with `ThreadingPolicy::Adaptive`. The 17 ms is the price of a
# lockfile with no unmaintained crate in it.
pic-scale = "0.7.11"
markdown = "1.0.0"
notify = "8.2.0"
# Pinned exactly and kept in lockstep with `oxc-transform` in
# packages/ruvyxa/package.json: the Rust bundler compiles the client bundle and
# the Node runtime compiles the server bundle, so a version split would let the
# two halves of one page disagree. `scripts/check-oxc-lockstep.mjs` enforces it.
oxc = { version = "=0.146.0", default-features = false, features = ["codegen", "minifier", "semantic", "transformer"] }
parking_lot = "0.12.5"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5"
webp = { version = "0.3.1", default-features = false }
