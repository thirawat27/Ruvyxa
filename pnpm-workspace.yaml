packages:
  - 'packages/*'
  - 'packages/@ruvyxa/*'
  - 'examples/*'
# Force a single physical React across the workspace. @ruvyxa/react declares
# react/react-dom as peers, so a published app dedupes to the app's copy; inside
# this monorepo two versions can otherwise coexist in the store, which loads two
# React instances into a server render and breaks hooks with an "invalid hook
# call". A real install is unaffected — this only pins the workspace's copies.
overrides:
  react: 19.2.8
  react-dom: 19.2.8
  # `ajv` asks for `^3.0.1` and resolved 3.1.5, which carries four high
  # advisories — two SSRF, two host confusion, all in URI normalisation. Nothing
  # here executes it: it arrives under `webpack`'s `schema-utils`, and webpack is
  # an auto-installed peer of `react-server-dom-webpack` that this repository
  # never loads. A transitive nobody runs is still a transitive `pnpm audit`
  # reports, and the floor costs nothing — the range is the one `ajv` already
  # declared, narrowed to its first patched release.
  fast-uri: ^3.1.6
# `react-server-dom-webpack` lists webpack as a peer for one file — its bundler
# plugin — which Ruvyxa never loads: the entries it does load (`server.edge`,
# `client.edge`, `client.browser`) reach the framework through two globals and
# nothing else. Auto-installing that peer pulls roughly fifty packages in to
# satisfy a build tool this repo does not use. Apps that adopt server components
# want the same rule; `docs/*/04-routing-rendering.md` says so.
peerDependencyRules:
  ignoreMissing:
    - webpack
allowBuilds:
  # Dart Sass uses this optional native watcher only for its CLI watch mode. Ruvyxa calls the
  # compile API directly, so keep the install deterministic without executing its build script.
  '@parcel/watcher': false
