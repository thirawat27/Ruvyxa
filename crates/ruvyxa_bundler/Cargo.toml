[package]
name = "ruvyxa_bundler"
version = "1.0.32"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ruvyxa Bundler TypeScript/JSX compiler"
# Shipped inside the npm-distributed `ruvyxa` binary, never as a crates.io crate.
# Marking it explicitly keeps the Rust surface internal, so a signature change
# here is not a semver break for anyone.
publish = false

[dependencies]
ruvyxa_diagnostics = { path = "../ruvyxa_diagnostics" }
blake3 = { workspace = true }
dashmap = { workspace = true }
grass = { workspace = true }
markdown = { workspace = true }
oxc = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
