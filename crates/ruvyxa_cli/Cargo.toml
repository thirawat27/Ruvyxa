[package]
name = "ruvyxa_cli"
version = "1.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ruvyxa"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
# Decoding, resizing, and WebP encoding all live in `ruvyxa_dev_server`
# (`image_decode` and `image_codec`), which this crate calls. The decoder,
# resizer, and encoder crates reach this binary through that module and must not
# be declared here again — a second declaration is what lets the two halves
# drift to different versions.
rayon.workspace = true
ruvyxa_bundler = { path = "../ruvyxa_bundler" }
ruvyxa_dev_server = { path = "../ruvyxa_dev_server" }
ruvyxa_diagnostics = { path = "../ruvyxa_diagnostics" }
ruvyxa_graph = { path = "../ruvyxa_graph" }
ruvyxa_middleware = { path = "../ruvyxa_middleware" }
ruvyxa_tui = { path = "../ruvyxa_tui" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

# Reading how much memory the machine actually has free, so build concurrency
# can be sized to the host instead of to its core count alone (see
# `src/host_resources.rs`). Both crates are already in the dependency graph
# through transitive deps, so neither adds to the shipped binary's build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# Every unix, not only Darwin.
#
# The pid-liveness probes in `build_output.rs` read `/proc` on Linux and reach
# for `libc` only on Darwin, which is why this used to be Darwin-only. Restoring
# the default `SIGPIPE` disposition in `main` needs it everywhere: Rust ignores
# that signal at startup so a write returns `EPIPE`, and `println!` panics on a
# failed write -- so `ruvyxa routes | head -3` ended in a panic naming a broken
# pipe rather than in the silence every other tool in a pipeline manages.
#
# It is not a new dependency in any real sense: twenty-six crates in this
# lockfile already pull `libc` in, tokio and socket2 among them, so it is
# compiled on every unix target with or without this line.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# `tests/ci_workflows.rs` asserts properties of `.github/workflows/*.yml`, and
# a workflow is a machine-read document: matching its text passes on exactly
# the bugs that class produces, so the gate parses it.
serde_yaml_ng = { workspace = true }
# Test fixtures only: these tests must put real encoded files on disk for the
# optimizer to sniff and decode. Decoding in this crate goes through
# `ruvyxa_dev_server::image_decode`.
jpeg-encoder.workspace = true
png.workspace = true
tempfile.workspace = true

[lints]
workspace = true
