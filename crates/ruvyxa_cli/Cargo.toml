[package]
name = "ruvyxa_cli"
version = "1.0.30"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ruvyxa"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
# Resizing and WebP encoding live in `ruvyxa_dev_server::image_codec`; only the
# decode and header read happen here, so `image` is the sole direct image
# dependency. `fast_image_resize` and `webp` reach this binary through that
# module and must not be declared again — a second declaration is what lets the
# two halves drift to different versions.
image.workspace = true
rayon.workspace = true
ruvyxa_bundler = { path = "../ruvyxa_bundler" }
ruvyxa_dev_server = { path = "../ruvyxa_dev_server" }
ruvyxa_diagnostics = { path = "../ruvyxa_diagnostics" }
ruvyxa_graph = { path = "../ruvyxa_graph" }
ruvyxa_middleware = { path = "../ruvyxa_middleware" }
ruvyxa_tui = { path = "../ruvyxa_tui" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

# Reading how much memory the machine actually has free, so build concurrency
# can be sized to the host instead of to its core count alone (see
# `src/host_resources.rs`). Both crates are already in the dependency graph
# through transitive deps, so neither adds to the shipped binary's build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile.workspace = true
