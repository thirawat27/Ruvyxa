<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ruvyxa Bundle Analyzer</title>
    <style>
      :root { color-scheme: dark; --bg:#111417; --panel:#181d22; --line:#2a323a; --muted:#92a0ad; --text:#eef3f7; --accent:#47b7c8; --warn:#e5ad54; --bad:#ec7777; font-family:Inter,ui-sans-serif,system-ui,sans-serif }
      * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text) }
      header { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:20px; padding:16px 24px; border-bottom:1px solid var(--line); background:rgba(17,20,23,.96) }
      h1 { margin:0; font-size:20px; letter-spacing:-.02em } header span { color:var(--muted); font:12px ui-monospace,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
      main { max-width:1320px; margin:auto; padding:24px }
      .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:var(--panel) }
      .metric { padding:18px; border-right:1px solid var(--line) } .metric:last-child { border:0 }
      .metric small { display:block; color:var(--muted); margin-bottom:6px } .metric strong { font-size:24px; font-variant-numeric:tabular-nums }
      .toolbar { display:flex; gap:12px; align-items:center; margin:24px 0 12px }
      input { flex:1; min-width:180px; padding:10px 12px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px }
      input:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
      table { width:100%; border-collapse:collapse; border:1px solid var(--line); background:var(--panel) }
      th,td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; font-size:13px } th { color:var(--muted); font-weight:600 }
      td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap } code { color:#bee9ef }
      .bar-track { width:180px; height:8px; background:#242b31; border-radius:2px; overflow:hidden } .bar { height:100%; background:var(--accent) }
      .empty { padding:36px; text-align:center; color:var(--muted) } .bad { color:var(--bad) }
      @media (max-width:760px) { main{padding:16px}.summary{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.bar-track{width:90px}th:nth-child(4),td:nth-child(4){display:none} }
      @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important } }
    </style>
  </head>
  <body>
    <header><h1>Ruvyxa Bundle Analyzer</h1><span id="root"></span></header>
    <main>
      <section class="summary" aria-label="Bundle summary">
        <div class="metric"><small>Page routes</small><strong id="routes">0</strong></div>
        <div class="metric"><small>Output</small><strong id="output">0 B</strong></div>
        <div class="metric"><small>Estimated gzip</small><strong id="gzip">0 B</strong></div>
        <div class="metric"><small>Diagnostics</small><strong id="diagnostics">0</strong></div>
      </section>
      <div class="toolbar"><input id="filter" type="search" placeholder="Filter routes or modules…" aria-label="Filter routes or modules" /></div>
      <table>
        <thead><tr><th>Route</th><th>Bundle</th><th>Relative size</th><th>Modules</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No routes match this filter.</div>
    </main>
    <script id="analysis" type="application/json">__RUVYXA_ANALYSIS_DATA__</script>
    <script>
      /*
       * Written out rather than hand-minified. This report is a local artifact
       * opened by the developer who ran `ruvyxa analyze`, so nothing here is on a
       * payload budget, and the single-line form made the row builder unreadable.
       */
      ;(() => {
        const data = JSON.parse(document.getElementById('analysis').textContent)
        const manifest = data.bundle.clientManifest || {}
        const routes = manifest.routes || []

        function formatBytes(value) {
          if (!Number.isFinite(value)) return '0 B'
          const units = ['B', 'KB', 'MB']
          let amount = value
          let unit = 0
          while (amount >= 1024 && unit < units.length - 1) {
            amount /= 1024
            unit++
          }
          return `${amount.toFixed(unit ? 1 : 0)} ${units[unit]}`
        }

        function routeBytes(route) {
          const own = Number(route.outputBytes ?? route.bytes ?? 0)
          const chunks = [...(route.chunks || []), ...(route.sharedChunks || [])]
          return own + chunks.reduce((total, chunk) => total + Number(chunk.bytes || 0), 0)
        }

        function moduleNames(route) {
          return [
            ...new Set([
              ...(route.chunkManifest?.modules || []),
              ...(route.chunks || []).flatMap((chunk) => chunk.modules || []),
              ...(route.sharedChunks || []).flatMap((chunk) => chunk.modules || []),
            ]),
          ]
        }

        const max = Math.max(1, ...routes.map(routeBytes))
        const tbody = document.getElementById('rows')
        const empty = document.getElementById('empty')

        document.getElementById('root').textContent = data.root
        document.getElementById('routes').textContent = String(routes.length)
        document.getElementById('output').textContent = formatBytes(
          Number(manifest.outputBytes || 0),
        )
        document.getElementById('gzip').textContent = formatBytes(
          Number(manifest.estimatedGzBytes || 0),
        )

        const diagnostics = document.getElementById('diagnostics')
        diagnostics.textContent = String(data.validation.diagnostics.length)
        if (data.validation.diagnostics.length) {
          diagnostics.classList.add('bad')
        }

        function element(tag, className) {
          const node = document.createElement(tag)
          if (className) node.className = className
          return node
        }

        function buildRow(route) {
          const row = document.createElement('tr')
          const size = routeBytes(route)
          const modules = moduleNames(route)

          const path = element('td')
          const code = document.createElement('code')
          code.textContent = route.path
          path.append(code)
          row.append(path)

          const amount = element('td', 'num')
          amount.textContent = formatBytes(size)
          row.append(amount)

          const visual = element('td')
          const track = element('div', 'bar-track')
          const bar = element('div', 'bar')
          bar.style.width = `${Math.max(2, (size / max) * 100)}%`
          track.append(bar)
          visual.append(track)
          row.append(visual)

          const count = element('td')
          count.textContent = `${modules.length} module${modules.length === 1 ? '' : 's'}`
          count.title = modules.join('\n')
          row.append(count)

          return row
        }

        function matchesFilter(route, needle) {
          if (!needle) return true
          return `${route.path} ${moduleNames(route).join(' ')}`.toLowerCase().includes(needle)
        }

        function render(query = '') {
          tbody.replaceChildren()
          const needle = query.trim().toLowerCase()
          const visible = routes.filter((route) => matchesFilter(route, needle))
          for (const route of visible) {
            tbody.append(buildRow(route))
          }
          empty.hidden = visible.length !== 0
        }

        document.getElementById('filter').addEventListener('input', (event) => {
          render(event.currentTarget.value)
        })
        render()
      })()
    </script>
  </body>
</html>
