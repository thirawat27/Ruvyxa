[package]
name = "ruvyxa_dev_server"
version = "1.0.30"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
base64.workspace = true
# Already compiled as part of tower-http's compression features; declaring them
# directly adds no crate to the build and lets the render cache keep the encoded
# copy of a page instead of re-encoding identical bytes on every cache hit.
brotli = "8.0.4"
flate2 = "1.1.9"
# Already in the tree via tower-http. Lets a large public asset reach the socket
# as a stream instead of being read into memory in full before the first byte
# is written.
tokio-util = { version = "0.7.19", features = ["io"] }
blake3.workspace = true
futures-core.workspace = true
futures-util.workspace = true
image.workspace = true
notify.workspace = true
parking_lot.workspace = true
ruvyxa_diagnostics = { path = "../ruvyxa_diagnostics" }
ruvyxa_bundler = { path = "../ruvyxa_bundler" }
ruvyxa_graph = { path = "../ruvyxa_graph" }
ruvyxa_middleware = { path = "../ruvyxa_middleware" }
ruvyxa_tui = { path = "../ruvyxa_tui" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
walkdir.workspace = true
webp.workspace = true
fast_image_resize.workspace = true

[dev-dependencies]
tempfile.workspace = true
