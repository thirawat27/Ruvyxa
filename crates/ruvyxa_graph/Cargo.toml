[package]
name = "ruvyxa_graph"
version = "1.0.30"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Route validation reuses the bundler's comment- and string-aware source scanner
# so "does this page export a default?" has one answer in the workspace instead
# of a second text scan that disagrees with the compiler.
ruvyxa_bundler = { path = "../ruvyxa_bundler" }
ruvyxa_diagnostics = { path = "../ruvyxa_diagnostics" }
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
